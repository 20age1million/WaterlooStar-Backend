version: "2"
sql:
  - engine: postgresql
    # Schema is read from the migration files themselves, so the migrations stay
    # the single source of truth and generated types cannot drift from them.
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/db/sqlcgen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "uuid.UUID"
              pointer: true
              import: "github.com/google/uuid"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # Dates and numerics as Go primitives rather than pgtype wrappers, so
          # the mapping to the contract stays readable. pgx scans both directly.
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
