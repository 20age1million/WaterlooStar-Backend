# ============================
# CI/CD PIPELINE (Drone) — WaterlooStar API
# Pattern: Host-git + Compose  (same shape as XitaOrz.com)
# ============================
# What this does:
# 1) Run the Go test suite. Nothing is built or deployed if it fails.
# 2) Sync the repo into the runner host at /opt/repo/waterloostar-backend
# 3) Build a Docker image from this repo and push it to GHCR
# 4) Apply database migrations, then deploy with the host's docker-compose.yml
#
# PREREQS (Ops):
# - Drone runner must mount:
#     - /var/run/docker.sock   (so steps can talk to host Docker)
#     - /opt/repo              (where deploy copies live)
# - Secrets set in Drone repo settings:
#     GHCR_USERNAME = <github username or org>
#     GHCR_TOKEN    = <PAT with read:packages, write:packages, repo>
# - On the host, once: /opt/repo/env/waterloostar-backend.env with
#     POSTGRES_PASSWORD=<openssl rand -hex 24>
#     JWT_SECRET=<openssl rand -base64 48>
#   It lives outside the git checkout, which is reset on every deploy.
#
# WHAT IS DEPLOYED: deploy/docker-compose.yml — Postgres and the API, neither
# with a public port. waterloostar.com is served by the frontend; its Next.js
# server calls this API over the shared `waterloostar` Docker network at
# http://api:8080. The compose file in the repository root is for local
# development only.

kind: pipeline
type: docker
name: build_and_deploy

trigger:
  event: [ push, custom ]
  # main only. Every push here deploys, so a feature branch must never match.
  branch: [ main ]

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock
  - name: repo_root
    host:
      path: /opt/repo

steps:
  # 1) Tests gate everything else. They need no database: the handler suite
  #    runs against an in-memory fake.
  - name: test
    image: golang:1.26-alpine
    environment:
      CGO_ENABLED: 0
    commands:
      - go vet ./...
      - go test ./...

  # 2) Sync the repo into the host folder: /opt/repo/<repo_name_lowercase>
  - name: sync-host-repo
    image: alpine:3.20
    volumes:
      - name: repo_root
        path: /opt/repo
    environment:
      REPO_DIR: "/opt/repo/${DRONE_REPO_NAME,,}"
    commands:
      - apk add --no-cache git
      - REMOTE_URL="$(git -C $DRONE_WORKSPACE config --get remote.origin.url)"
      - mkdir -p "$REPO_DIR"
      - >
        if [ ! -d "$REPO_DIR/.git" ]; then
          git clone --depth=1 "$REMOTE_URL" "$REPO_DIR";
        else
          git -C "$REPO_DIR" remote set-url origin "$REMOTE_URL" || true;
          git -C "$REPO_DIR" fetch --all --prune;
          git -C "$REPO_DIR" reset --hard "origin/${DRONE_BRANCH}";
        fi
      - git -C "$REPO_DIR" checkout -qf "${DRONE_COMMIT_SHA}" || true

  # 3) Build & push image to GHCR
  - name: build-push-ghcr
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    settings:
      registry: ghcr.io
      # GHCR paths must be lowercase; these vars enforce it.
      repo: ghcr.io/${DRONE_REPO_OWNER,,}/${DRONE_REPO_NAME,,}
      tags:
        - latest
        - ${DRONE_COMMIT_SHA}    # immutable tag for rollbacks
      dockerfile: Dockerfile
      context: .
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN

  # 4) Migrate, then deploy.
  - name: deploy
    image: docker:27-cli
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
      - name: repo_root
        path: /opt/repo
    environment:
      REPO_DIR: "/opt/repo/${DRONE_REPO_NAME,,}"
      GHCR_USERNAME:
        from_secret: GHCR_USERNAME
      GHCR_TOKEN:
        from_secret: GHCR_TOKEN
      TAG: "latest"            # CHANGE to "${DRONE_COMMIT_SHA}" for pinned deploys
      COMPOSE_SUBDIR: "deploy"
      ENV_FILE: /opt/repo/env/waterloostar-backend.env
    commands:
      - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - export TAG
      # No braces here, on purpose. Drone rewrites every dollar-brace variable
      # in this file with its own variables before the step runs, and an
      # unknown one becomes empty. The braced form of COMPOSE_SUBDIR did, so
      # this ran in the repo root against the local-development compose file,
      # which has no `api` service. Written as $COMPOSE_SUBDIR, Drone leaves
      # it for the shell.
      - cd "$REPO_DIR/$COMPOSE_SUBDIR"
      # Stop if that ever happens again, rather than deploying the wrong file.
      - test -f docker-compose.yml && grep -q "^  api:" docker-compose.yml || (echo "Not the deploy compose file — check COMPOSE_SUBDIR" && exit 1)

      # Say what is missing, rather than letting compose fail on an empty
      # variable three steps later.
      - test -f "$ENV_FILE" || (echo "Missing $ENV_FILE — see deploy/docker-compose.yml" && exit 1)

      # Shared with the frontend's stack, and it can deploy first.
      - docker network inspect waterloostar >/dev/null 2>&1 || docker network create waterloostar

      - docker compose --env-file "$ENV_FILE" pull

      # Migrations run as their own step, before the new code serves traffic.
      # Doing it on container start would have every replica race the others,
      # and golang-migrate takes a lock but the losers then fail their health
      # checks. `up` is idempotent: with nothing pending it is a no-op.
      - docker compose --env-file "$ENV_FILE" run --rm api migrate up

      - docker compose --env-file "$ENV_FILE" up -d

      # Fail the build if the new container is not actually answering, rather
      # than reporting a green deploy over a crash loop.
      - sleep 5
      - docker compose --env-file "$ENV_FILE" exec -T api wget -qO- http://127.0.0.1:8080/healthz
