openapi: 3.0.3

info:
  title: WaterlooStar API
  version: 0.1.0
  description: |
    Backend for WaterlooStar — a housing marketplace and community forum for
    University of Waterloo students.

    This file is the contract and is authoritative. The Go server interfaces in
    `internal/httpapi/gen` and the TypeScript types in the frontend repository
    are both generated from it, so it is edited *before* the handler that serves
    a new shape, never after.

    Vocabulary note: the product says "Housing Available" and "Looking for
    Housing". The internal terms *renter* and *rentee* never appear in any path,
    field name or response body.

    ## Rate limiting

    Authentication and the write endpoints are rate limited and may answer `429`
    with a `Retry-After` header. The limit is keyed on **identity** — the address
    being logged into, the token being redeemed, the signed-in user — and not on
    IP address: this service has no public URL, so every request reaches it from
    the frontend's address and per-IP counting inside it would treat the whole
    internet as one client. Per-IP limiting belongs at the reverse proxy.

    A client may send `X-Client-IP` with the real address of the person it is
    acting for, and it will be used as an additional dimension of the key. It is
    trusted *only* because this service is unreachable from the internet; if that
    ever changes, the header must stop being trusted on the same day.

    Nothing is ever locked: an exhausted allowance refills on a clock, and a
    successful login costs nothing at all.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Service health and operational endpoints.
  - name: auth
    description: Registration, address verification, and session lifecycle.
  - name: me
    description: The signed-in user.
  - name: housing
    description: |
      Housing Available - places students are offering. Public: browsing does
      not require an account.
  - name: messages
    description: |
      Conversations between two students about one listing: its **owner**, and
      the student asking about it, the **enquirer**. Every path here is for the
      two participants only, and answers **404** - never 403 - to anyone else.

      There is no accept step. Either participant can write from the first
      message on, and either can **close** the conversation, after which
      neither can send. It stays readable. There is one conversation per
      listing and enquirer, so closing also stops that enquirer opening another
      about the same listing.

      A conversation never carries anyone's email or phone number. Opening one
      reveals nothing, and neither does sending, replying, reading or closing.
      The exact address of a place is shared by its **owner**, by hand, with
      `POST /conversations/{id}/share-address`, and by nothing else. A share
      covers that one conversation, cannot be undone, and fills the
      conversation's `place`. The listing summary here carries no address.

      While the listing is taken down by a moderator, or either participant's
      account is suspended, the conversation stays visible but read-only. A
      shared `place` is withheld while the listing is taken down or its owner
      is suspended, without being un-shared, and returns when that ends.

  - name: admin
    description: |
      The operator's surface. Every path here requires a session whose role is
      `admin`, and answers **404** - not 401 or 403 - to anyone else, including
      an anonymous caller. The refusal is the same one an unknown path gets, so
      probing cannot tell that the surface exists.

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service and database health
      description: |
        Reports whether the service is up and whether it can reach PostgreSQL.
        Returns 503 when the database round-trip fails, so a load balancer can
        take the instance out of rotation rather than sending it traffic it
        cannot serve.
      security: []
      responses:
        "200":
          description: Service is healthy and the database responded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is running but a dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      description: |
        Creates an unverified account and emails a confirmation link. The address
        must be a `uwaterloo.ca` one - that restriction is the basis of the
        "verified student" badge the product is built on.

        Registering does not sign you in. Confirm the address first, then log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; a confirmation email has been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            That address or username is already taken. The response does not say
            which, so this endpoint cannot be used to enumerate accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address
      description: |
        Redeems the token from a confirmation email and marks the account
        verified. Tokens are single-use and expire after 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Address confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The token is unknown, already used, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/verify/resend:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Send a new confirmation email
      description: |
        For a student whose confirmation link is lost or expired. When the
        address belongs to an account that is not yet verified and not
        suspended, every outstanding link for it is spent and a new one is
        sent. Otherwise nothing is sent.

        Always answers 202, whatever the address - otherwise this endpoint
        would reveal which addresses have accounts, and which are verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: If that address has an unconfirmed account, a new link is on its way.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session
      description: |
        On success, sets three cookies: an httpOnly session cookie holding a
        short-lived access token, an httpOnly refresh cookie scoped to
        `/auth/refresh`, and a readable CSRF cookie whose value must be echoed in
        the `X-CSRF-Token` header on later unsafe requests.

        An unverified account may log in - it simply cannot do anything that
        requires verification yet.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. Session cookies are set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            The address and password do not match. Deliberately identical whether
            or not the address exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The account is suspended. Returned only when the password is
            correct, so it tells someone guessing nothing they did not know.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Exchange the refresh cookie for a new session
      description: |
        Rotates the refresh token: the presented one is revoked as the
        replacement is issued, so a stolen token stops working as soon as the
        real user refreshes.
      security: []
      responses:
        "200":
          description: New session cookies set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: The refresh cookie is missing, expired or already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      description: |
        Revokes the refresh token and clears the cookies. Succeeds even when no
        session is present, so a client can always reach a signed-out state.
      security: []
      responses:
        "204":
          description: Signed out; cookies cleared.
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password-reset email
      description: |
        Always answers 202, whether or not the address is registered - otherwise
        this endpoint would reveal which addresses have accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: If that address has an account, an email is on its way.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      description: |
        Redeems a reset token and replaces the password. Every existing session
        for that account is revoked, so a reset actually evicts whoever prompted it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password changed; all sessions revoked.
        "400":
          description: The token is unknown, used, or expired; or the password is too weak.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /listings:
    get:
      tags: [housing]
      operationId: listListings
      summary: Browse Housing Available
      description: |
        Published listings, newest first. Public - anyone can browse; an account
        is only needed to save one or message the poster.

        Every filter is optional and they compose. The total in `meta` reflects
        the filters, so it is the number to show a user.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          description: |
            Full-text search over title, neighbourhood, cross streets and
            description. The exact address is **not** searched: a hidden field
            that could still be matched could be confirmed by probing.
            Supports quoted phrases and `-exclusion`.
          schema: { type: string }
        - name: start_after
          in: query
          description: Only listings available by this date.
          schema: { type: string, format: date }
        - name: end_before
          in: query
          description: Only listings that run at least until this date.
          schema: { type: string, format: date }
        - name: price_min_cents
          in: query
          schema: { type: integer, minimum: 0 }
        - name: price_max_cents
          in: query
          schema: { type: integer, minimum: 0 }
        - name: all_in_max_cents
          in: query
          description: |
            Only listings whose rent plus bill estimate is at most this. A
            listing that has not stated an estimate is excluded: its monthly
            cost is unknown, not equal to its rent.
          schema: { type: integer, minimum: 0 }
        - name: distance_max_m
          in: query
          description: |
            Maximum straight-line metres to campus. Listings with no recorded
            distance are excluded when this is set.
          schema: { type: integer, minimum: 0 }
        - name: bedrooms_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: furnished
          in: query
          schema: { type: boolean }
        - name: parking
          in: query
          schema: { type: boolean }
        - name: pets
          in: query
          schema: { type: boolean }
        - name: laundry
          in: query
          schema: { type: boolean }
        - name: utilities
          in: query
          description: Repeatable. A listing must include *every* one requested.
          schema:
            type: array
            items:
              type: string
              enum: [internet, hydro, water, heat, gas]
          style: form
          explode: true
        - name: verified_only
          in: query
          description: Only listings posted by a verified student.
          schema: { type: boolean }
        - name: sort
          in: query
          description: |
            With both `start_after` and `end_before`, `match` ranks first the
            listings a student can take for exactly that window — the same
            dates, or shorter stays allowed and the window at least the
            minimum stay — then the rest, newest first within each. Without a
            window it orders by newest. `allInAsc` orders by rent plus bill
            estimate, cheapest first, with unknown estimates last.
          schema:
            type: string
            enum: [match, new, priceAsc, priceDesc, distance, allInAsc]
            default: new
      responses:
        "200":
          description: A page of listings matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [housing]
      operationId: createListing
      summary: Post a place
      description: |
        Creates a listing owned by the signed-in user. Only a **verified**
        student may post — confirming a `uwaterloo.ca` address is what the badge
        on every listing means.

        The listing is published immediately unless `status` says otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Signed in, but the address has not been confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /listings/availability:
    get:
      tags: [housing]
      operationId: getListingAvailability
      summary: How many places are open in each month
      description: |
        For each month of `year`, how many published listings are open at any
        point in it, under the same filters as `GET /listings` except the date
        window, which this replaces. Always twelve months; a month with nothing
        open is 0. Public, like browsing.
      security: []
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, minimum: 2020, maximum: 2100 }
        - name: q
          in: query
          schema: { type: string }
        - name: price_min_cents
          in: query
          schema: { type: integer, minimum: 0 }
        - name: price_max_cents
          in: query
          schema: { type: integer, minimum: 0 }
        - name: all_in_max_cents
          in: query
          schema: { type: integer, minimum: 0 }
        - name: distance_max_m
          in: query
          schema: { type: integer, minimum: 0 }
        - name: bedrooms_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: furnished
          in: query
          schema: { type: boolean }
        - name: parking
          in: query
          schema: { type: boolean }
        - name: pets
          in: query
          schema: { type: boolean }
        - name: laundry
          in: query
          schema: { type: boolean }
        - name: utilities
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [internet, hydro, water, heat, gas]
          style: form
          explode: true
        - name: verified_only
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Twelve months, January first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingAvailability"
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /listings/{id}:
    get:
      tags: [housing]
      operationId: getListing
      summary: One listing in full
      description: |
        A published listing with everything the detail screen shows. A listing
        that does not exist, or is not published, returns 404 - a paused or
        archived post must not be distinguishable from one that never existed.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [housing]
      operationId: updateListing
      summary: Edit your listing
      description: |
        Changes only the fields present in the body; anything omitted is left
        alone. Someone else's listing answers 404, not 403 — a 403 would confirm
        it exists.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: The updated listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A moderator has taken this post down. It cannot be edited, republished
            or archived until it is restored; `message` carries the moderator's
            reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [housing]
      operationId: deleteListing
      summary: Take your listing down
      description: |
        Archives the listing rather than removing the row. Questions asked on it,
        and later saves and conversations, hang off that row; deleting it would
        rewrite other people's history. Archiving is terminal.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Archived.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A moderator has taken this post down. It cannot be edited, republished
            or archived until it is restored; `message` carries the moderator's
            reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /listings/{id}/status:
    post:
      tags: [housing]
      operationId: setListingStatus
      summary: Publish, pause or archive your listing
      description: |
        Pausing is a different act from correcting the rent, so it is a different
        endpoint with its own rules.

        `draft -> published -> paused -> published` all move freely. `archived`
        is terminal: a post that has been taken down stays down, and bringing one
        back means posting again — which is honest, since the term and the price
        will have changed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, published, paused, archived]
      responses:
        "200":
          description: The listing in its new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          description: That transition is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A moderator has taken this post down. It cannot be edited, republished
            or archived until it is restored; `message` carries the moderator's
            reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /me/listings:
    get:
      tags: [housing]
      operationId: listMyListings
      summary: Your own listings, whatever their state
      description: |
        Everything you have posted, including drafts, paused and archived
        listings — none of which appear in public results.
      responses:
        "200":
          description: Your listings, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /requests:
    get:
      tags: [housing]
      operationId: listRequests
      summary: Browse Looking for Housing
      description: |
        Published requests, newest first. Public, like listings - a request says
        what someone needs and carries no address.

        The filters read from the owner's side: `budget_min_cents` asks who can
        afford a given rent, and `distance_min_m` asks who would accept a place
        that far out. Every filter is optional and they compose.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          description: Full-text search over title, neighbourhood and description.
          schema: { type: string }
        - name: start_after
          in: query
          description: Only requests that begin by this date.
          schema: { type: string, format: date }
        - name: end_before
          in: query
          description: Only requests that run at least until this date.
          schema: { type: string, format: date }
        - name: budget_min_cents
          in: query
          description: |
            Only requests whose budget reaches at least this much - the rent you
            are asking.
          schema: { type: integer, minimum: 0 }
        - name: budget_max_cents
          in: query
          schema: { type: integer, minimum: 0 }
        - name: distance_min_m
          in: query
          description: |
            Only requests willing to be at least this far from campus - how far
            out your place is. Requests that state no radius are included: no
            preference is not a narrow one.
          schema: { type: integer, minimum: 0 }
        - name: occupants_max
          in: query
          description: Only requests for at most this many people.
          schema: { type: integer, minimum: 1 }
        - name: pets
          in: query
          schema: { type: boolean }
        - name: furnished
          in: query
          description: Only requests that prefer a furnished place.
          schema: { type: boolean }
        - name: parking
          in: query
          schema: { type: boolean }
        - name: laundry
          in: query
          schema: { type: boolean }
        - name: verified_only
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [new, match, budgetAsc, budgetDesc, soonest]
            default: new
      responses:
        "200":
          description: A page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [housing]
      operationId: createRequest
      summary: Post what you are looking for
      description: |
        Creates a request owned by the signed-in user. Only a **verified**
        student may post, as with listings.

        Published immediately unless `status` says otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Signed in, but the address has not been confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /requests/{id}:
    get:
      tags: [housing]
      operationId: getRequest
      summary: One request
      description: Public. A draft, paused or taken-down request answers 404.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingRequest"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [housing]
      operationId: updateRequest
      summary: Edit your request
      description: |
        Changes only the fields present in the body. Someone else's request
        answers 404, not 403 - a 403 would confirm it exists.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUpdate"
      responses:
        "200":
          description: The updated request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A moderator has taken this post down. It cannot be edited, republished
            or archived until it is restored; `message` carries the moderator's
            reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [housing]
      operationId: deleteRequest
      summary: Take your request down
      description: |
        Archives the request rather than removing the row, as with listings.
        Archiving is terminal.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Archived.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A moderator has taken this post down. It cannot be edited, republished
            or archived until it is restored; `message` carries the moderator's
            reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /requests/{id}/status:
    post:
      tags: [housing]
      operationId: setRequestStatus
      summary: Publish, pause or archive your request
      description: |
        `draft -> published -> paused -> published` all move freely. `archived`
        is terminal: found a place, and the request is done.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, published, paused, archived]
      responses:
        "200":
          description: The request in its new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingRequest"
        "400":
          description: That transition is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A moderator has taken this post down. It cannot be edited, republished
            or archived until it is restored; `message` carries the moderator's
            reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /requests/{id}/offers:
    get:
      tags: [housing]
      operationId: listOffers
      summary: The offers on a request
      description: |
        Visible to the student who posted the request, and to each owner for
        their own offer. Not public: owners reading each other's answers would
        turn a request into an auction.

        An offer disappears here when its listing stops being published, so
        taking a place down withdraws its offers with nothing else to remember.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The live offers, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestOffer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [housing]
      operationId: createOffer
      summary: Answer a request with one of your listings
      description: |
        Offers a listing you own against a request. The offer references the
        listing rather than repeating it, so the student sees real rent, dates
        and distance.

        If you have nothing suitable posted, post the listing first and then
        offer it - two calls, which a client can present as one flow.

        The same listing cannot be offered twice against one request.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id]
              properties:
                listing_id:
                  type: string
                  format: uuid
                  description: One of your own published listings.
                note:
                  type: string
                  maxLength: 1000
                  description: Optional. The listing says everything factual already.
      responses:
        "201":
          description: Offered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOffer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Signed in, but the address has not been confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That listing has already been offered against this request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /offers/{id}:
    delete:
      tags: [housing]
      operationId: withdrawOffer
      summary: Withdraw your offer
      description: |
        Only the owner who made it. Someone else's offer answers 404, never 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Withdrawn.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/requests:
    get:
      tags: [housing]
      operationId: listMyRequests
      summary: Your own requests, whatever their state
      description: |
        Everything you have posted, including drafts, paused and taken-down
        requests - none of which appear in public results.
      responses:
        "200":
          description: Your requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HousingRequest"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /listings/{id}/conversations:
    post:
      tags: [messages]
      operationId: startConversation
      summary: Message the owner of a listing
      description: |
        Opens a conversation with the listing's owner, with your first message
        in it. Only a **verified** student may start one, and only about a
        published listing that is not their own: a draft, paused or taken-down
        listing, or one whose owner is suspended, answers 404 as it does
        everywhere else.

        There is one conversation per listing and enquirer. Starting a second
        answers **409** with the existing conversation's id in
        `details.conversation_id`, whether it is open or closed, so a client
        can open that one instead.

        Opening a conversation reveals nothing about either side: no email, no
        phone number and no exact address.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Started, with the first message sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: |
            The message is empty or too long, or the listing is your own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Signed in, but the address has not been confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            You already have a conversation about this listing, open or closed.
            `details.conversation_id` names it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/conversations:
    get:
      tags: [messages]
      operationId: listMyConversations
      summary: Your conversations, newest activity first
      description: |
        Both sides: places you asked about, and conversations about your own
        listings. Ordered by the latest message, or by when the conversation
        was opened if it has none. A conversation whose listing was taken down
        or whose other participant is suspended is still listed, marked by
        `listing.available`, `counterpart_available` and `can_send`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: Only open, or only closed, conversations.
          schema:
            type: string
            enum: [open, closed]
        - name: side
          in: query
          description: |
            `owner`: conversations about your own listings. `enquirer`:
            conversations you opened about someone else's.
          schema:
            type: string
            enum: [owner, enquirer]
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/conversations/unread:
    get:
      tags: [messages]
      operationId: getUnreadCounts
      summary: How much is waiting for you
      description: |
        The counts a header badge or the home page needs, without loading the
        inbox. A message is unread when the other participant sent it after you
        last marked the conversation read. Not rate limited, so a client may
        poll it at a modest interval.
      responses:
        "200":
          description: Your unread counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCounts"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /conversations/{id}:
    get:
      tags: [messages]
      operationId: getConversation
      summary: One of your conversations
      description: |
        Participants only. Anyone else gets 404, as for an id that does not
        exist.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /conversations/{id}/messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: The messages in one of your conversations
      description: |
        Newest first, paged like every other list. A message that arrives while
        you read older pages shifts the offsets by one, so a client removes
        duplicates by id. Participants only; anyone else gets 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of messages, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send a message
      description: |
        Either participant, from the first message on, while the conversation
        is open. Refused with **409** once it is closed, while the other
        participant's account is suspended, and while the listing is taken
        down. Messages cannot be edited or deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Signed in, but the address has not been confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Nothing can be sent here: the conversation is closed, the other
            participant's account is no longer available, or the listing was
            taken down. `message` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /conversations/{id}/read:
    post:
      tags: [messages]
      operationId: markConversationRead
      summary: Mark a conversation read
      description: |
        Moves your read marker to now, so every message in it counts as read
        for you. The other participant's marker is untouched. Participants
        only; anyone else gets 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Marked read.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /conversations/{id}/close:
    post:
      tags: [messages]
      operationId: closeConversation
      summary: Close a conversation
      description: |
        Either participant. After it, neither side can send, and the enquirer
        cannot open another conversation about this listing. The conversation
        stays readable. Closing a closed conversation answers 200 with it
        unchanged. Participants only; anyone else gets 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /conversations/{id}/share-address:
    post:
      tags: [messages]
      operationId: shareAddress
      summary: Share the exact address with the enquirer
      description: |
        The listing's **owner** shares its exact address with the other
        participant of this conversation. It is the only way the exact address
        reaches another student: nothing else - not a reply, not opening a
        conversation, not an offer - reveals it.

        It **cannot be undone**: there is no un-share, so a client confirms
        before calling it. It covers **this conversation only**: the same
        student's conversation about another listing, and every other
        student's, are unaffected.

        Sharing again answers 200 with the conversation unchanged, its
        `address_shared_at` still the first share's. The response's `place`
        carries the address. Only the address is shared: never an email or a
        phone number. While the listing is taken down or its owner suspended,
        `place` is withheld (null) without the share being undone.

        Participants only; anyone else gets 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Shared, or already shared. `place` is filled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            You are the enquirer ("Only the owner can share the address of
            their place."), or your address has not been confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The address cannot be shared now: the conversation is closed, the
            enquirer's account is no longer available, the listing is not
            available (paused, archived, a draft or taken down), or the
            listing has no address to share. `message` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/overview:
    get:
      tags: [admin]
      operationId: getAdminOverview
      summary: Counts across the whole site
      responses:
        "200":
          description: The numbers an operator starts from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: Every account, searchable
      description: |
        Newest first. `q` matches part of an email address or username. Every
        filter is optional and they compose; the total in `meta` reflects them.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema:
            type: string
            enum: [user, moderator, admin]
        - name: verified
          in: query
          schema: { type: boolean }
        - name: suspended
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users/{id}:
    get:
      tags: [admin]
      operationId: getAdminUser
      summary: One account, and what has been done to it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The account and its ledger entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users/{id}/suspend:
    post:
      tags: [admin]
      operationId: suspendAdminUser
      summary: Suspend an account
      description: |
        The account can no longer log in or refresh, every session it has
        ends, and its listings, requests and offers leave public view. Nothing
        it posted is changed, so reinstating restores exactly what this hid.
        An admin cannot suspend themselves.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReason"
      responses:
        "200":
          description: The account as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The change cannot be made: it would change nothing, it targets your
            own account, or it would remove the last admin. `message` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users/{id}/reinstate:
    post:
      tags: [admin]
      operationId: reinstateAdminUser
      summary: Lift a suspension
      description: |
        The account can log in again and its posts return to public view
        in whatever state their owner left them.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReason"
      responses:
        "200":
          description: The account as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The change cannot be made: it would change nothing, it targets your
            own account, or it would remove the last admin. `message` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users/{id}/verify:
    post:
      tags: [admin]
      operationId: verifyAdminUser
      summary: Verify an account by hand
      description: |
        Marks the uwaterloo.ca address as confirmed without the email link.
        The account's next session refresh carries the change.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReason"
      responses:
        "200":
          description: The account as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The change cannot be made: it would change nothing, it targets your
            own account, or it would remove the last admin. `message` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/users/{id}/role:
    post:
      tags: [admin]
      operationId: setAdminUserRole
      summary: Change an account's role
      description: |
        Between `user` and `admin`. Ends the account's sessions, so the new
        role applies from its next login. An admin cannot change their own
        role, and the last admin cannot be demoted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleChange"
      responses:
        "200":
          description: The account as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The change cannot be made: it would change nothing, it targets your
            own account, or it would remove the last admin. `message` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/listings:
    get:
      tags: [admin]
      operationId: listAdminListings
      summary: Every listing, in any status
      description: |
        Newest first, including drafts, paused, archived and taken-down posts,
        and posts by suspended accounts. The one read in this API that is not
        limited to what the public sees.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          description: |
            The same full-text search the public reads use: title,
            neighbourhood, cross streets and description. Not the exact
            address, which is out of the search index.
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, paused, archived]
        - name: removed
          in: query
          schema: { type: boolean }
        - name: owner_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of listings with their owners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListingPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/listings/{id}/remove:
    post:
      tags: [admin]
      operationId: removeAdminListing
      summary: Take a listing down
      description: |
        Hides it from every public read, whatever its status, and stops its
        owner editing, republishing or archiving it. Its status is untouched.
        The owner sees the reason.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReason"
      responses:
        "200":
          description: The listing as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListing"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already taken down. The first takedown's reason stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/listings/{id}/restore:
    post:
      tags: [admin]
      operationId: restoreAdminListing
      summary: Restore a listing
      description: |
        Lifts the takedown. The listing returns in whatever status its owner
        left it. A reason is optional here; the change is logged either way.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOptionalReason"
      responses:
        "200":
          description: The listing as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListing"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not taken down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/requests:
    get:
      tags: [admin]
      operationId: listAdminRequests
      summary: Every request, in any status
      description: |
        Newest first, including drafts, paused, archived and taken-down posts,
        and posts by suspended accounts. The one read in this API that is not
        limited to what the public sees.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          description: The same full-text search the public reads use.
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, paused, archived]
        - name: removed
          in: query
          schema: { type: boolean }
        - name: owner_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of requests with their owners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRequestPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/requests/{id}/remove:
    post:
      tags: [admin]
      operationId: removeAdminRequest
      summary: Take a request down
      description: |
        Hides it from every public read, whatever its status, and stops its
