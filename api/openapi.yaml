          application/json:
            schema:
              $ref: "#/components/schemas/AdminReason"
      responses:
        "200":
          description: The request as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already taken down. The first takedown's reason stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/requests/{id}/restore:
    post:
      tags: [admin]
      operationId: restoreAdminRequest
      summary: Restore a request
      description: |
        Lifts the takedown. The request returns in whatever status its owner
        left it. A reason is optional here; the change is logged either way.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOptionalReason"
      responses:
        "200":
          description: The request as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not taken down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/actions:
    get:
      tags: [admin]
      operationId: listAdminActions
      summary: The ledger
      description: |
        Every change an admin has made, newest first. Append-only: nothing in
        this API edits or removes an entry.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of ledger entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionPage"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall service state.
        database:
          type: string
          enum: [ok, unreachable]
          description: Result of a real query against PostgreSQL.
        version:
          type: string
          description: Build version, when the binary was stamped with one.
      example:
        status: ok
        database: ok

    User:
      type: object
      description: |
        A user as exposed by the API. Never carries a password hash. `email` is
        present only when the user is looking at their own record.
      required: [id, username, role, verified, level, star_points, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
          description: Only returned to the user themselves.
        role:
          type: string
          enum: [user, moderator, admin]
        verified:
          type: boolean
          description: Whether the uwaterloo.ca address has been confirmed.
        avatar_url:
          type: string
          nullable: true
        level:
          type: integer
        star_points:
          type: integer
        created_at:
          type: string
          format: date-time
      example:
        id: 3f7c1b2a-9d4e-4c8a-8f1b-2e3d4c5b6a70
        username: meil
        email: meil@uwaterloo.ca
        role: user
        verified: true
        level: 4
        star_points: 120
        created_at: "2026-09-01T14:03:00Z"

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          description: Must end in `uwaterloo.ca`.
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_.-]+$"
        password:
          type: string
          minLength: 10
          maxLength: 72
          description: At least 10 characters. Capped at 72 bytes, which is bcrypt's limit.
      example:
        email: meil@uwaterloo.ca
        username: meil
        password: correct horse battery

    RegisterResponse:
      type: object
      required: [user, verification_required]
      properties:
        user:
          $ref: "#/components/schemas/User"
        verification_required:
          type: boolean
          description: Always true - confirm the address before logging in.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token from the emailed link.

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 72

    Listing:
      type: object
      description: |
        A "Housing Available" post. Every fact the interface displays is a
        field here rather than a sentence to be parsed: the filters in the next
        feature depend on it, and the frontend formats these into display text
        at the point of display.
      required:
        - id
        - title
        - body
        - conditions
        - price_cents
        - start_date
        - end_date
        - lease_months
        - term_tag
        - unit_type
        - bedrooms_total
        - bathrooms
        - bath_type
        - furnished
        - utilities
        - parking
        - pets
        - laundry
        - neighbourhood
        - cross_streets
        - commute_mode
        - status
        - views
        - replies
        - saves
        - created_at
        - owner
        - photos
        - shorter_stays
        - min_stay_months
        - bills_estimate_cents
        - all_in_cents
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          description: The poster's description of the place.
        conditions:
          type: array
          items:
            type: string
          description: The poster's own terms, shown as a list.
        price_cents:
          type: integer
          description: Monthly rent in cents of CAD.
        deposit_cents:
          type: integer
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        lease_months:
          type: integer
        term_tag:
          type: string
          description: Display label for the term, e.g. "Winter term".
        unit_type:
          type: string
          enum: [room, studio, unit]
        bedrooms_total:
          type: integer
        bedroom_of:
          type: integer
          nullable: true
          description: Which bedroom of bedrooms_total is offered. Null for a whole unit.
        bathrooms:
          type: number
        bath_type:
          type: string
          enum: [shared, private, ensuite]
        furnished:
          type: boolean
        utilities:
          type: array
          items:
            type: string
            enum: [internet, hydro, water, heat, gas]
          description: Which bills are included in the rent.
        parking:
          type: boolean
        pets:
          type: boolean
        laundry:
          type: boolean
        address_line:
          type: string
          description: |
            The exact address, house number included. Present only on your own
            listings and on the admin surface. Everyone else sees
            `neighbourhood` and `cross_streets`. The exact address reaches
            another student only when you share it in your conversation with
            them (`POST /conversations/{id}/share-address`).
        neighbourhood:
          type: string
          description: The area the place is in. Public.
        cross_streets:
          type: string
          maxLength: 80
          example: King St N & University Ave
          description: |
            The nearest intersection, e.g. "King St N & University Ave". Public:
            with `neighbourhood`, this is the approximate location everyone
            sees. Empty when the owner has not given one.
        lat:
          type: number
          nullable: true
          description: |
            Part of the exact address: it locates the same door. Null on every
            public read; present only on your own listings, on the admin
            surface, and in a conversation's shared `place`.
        lng:
          type: number
          nullable: true
          description: |
            Part of the exact address: it locates the same door. Null on every
            public read; present only on your own listings, on the admin
            surface, and in a conversation's shared `place`.
        distance_m:
          type: integer
          nullable: true
          description: Straight-line metres to campus.
        commute_minutes:
          type: integer
          nullable: true
        commute_mode:
          type: string
          enum: [walk, bus]
        minutes_to_transit:
          type: integer
          nullable: true
        minutes_to_grocery:
          type: integer
          nullable: true
        status:
          type: string
          enum: [draft, published, paused, archived]
        views:
          type: integer
        replies:
          type: integer
        saves:
          type: integer
        created_at:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/ListingOwner"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ListingPhoto"
        shorter_stays:
          type: boolean
          description: |
            Whether a student may rent part of the listed dates, for at least
            `min_stay_months`, at the same monthly rent. False means whole
            lease only: the listed dates are the only dates on offer.
        min_stay_months:
          type: integer
          nullable: true
          minimum: 1
          description: The shortest stay accepted. Set exactly when `shorter_stays` is true.
        bills_estimate_cents:
          type: integer
          nullable: true
          minimum: 0
          description: |
            The owner's estimate of the tenant's monthly share of every bill the
            rent does not include. 0 means nothing extra; null means not stated,
            and is never read as 0.
        all_in_cents:
          type: integer
          nullable: true
          readOnly: true
          description: |
            `price_cents` plus `bills_estimate_cents` — what a student pays a
            month. Null when the estimate is not stated; never guessed.
        removal:
          $ref: "#/components/schemas/PostRemoval"

    ListingAvailability:
      type: object
      required: [year, months]
      properties:
        year: { type: integer }
        months:
          type: array
          minItems: 12
          maxItems: 12
          items:
            type: object
            required: [month, open]
            properties:
              month: { type: integer, minimum: 1, maximum: 12 }
              open: { type: integer, minimum: 0 }

    ListingInput:
      type: object
      description: A new listing. Everything the hub filters on is required.
      required:
        - title
        - price_cents
        - start_date
        - end_date
        - lease_months
        - term_tag
        - unit_type
        - bedrooms_total
        - bathrooms
        - bath_type
        - address_line
      properties:
        title: { type: string, minLength: 8, maxLength: 200 }
        body: { type: string, maxLength: 8000 }
        conditions:
          type: array
          items: { type: string, maxLength: 500 }
          maxItems: 12
        price_cents: { type: integer, minimum: 1 }
        deposit_cents: { type: integer, minimum: 0, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        lease_months: { type: integer, minimum: 1, maximum: 24 }
        term_tag: { type: string, maxLength: 40 }
        unit_type: { type: string, enum: [room, studio, unit] }
        bedrooms_total: { type: integer, minimum: 0, maximum: 20 }
        bedroom_of: { type: integer, minimum: 1, nullable: true }
        bathrooms: { type: number, minimum: 0 }
        bath_type: { type: string, enum: [shared, private, ensuite] }
        furnished: { type: boolean }
        utilities:
          type: array
          items: { type: string, enum: [internet, hydro, water, heat, gas] }
        parking: { type: boolean }
        pets: { type: boolean }
        laundry: { type: boolean }
        address_line:
          type: string
          maxLength: 200
          description: |
            Private: the exact address, house number included. Shown only to
            you, to admins, and to a student you choose to share it with in
            your conversation. It is not searchable.
        neighbourhood: { type: string, maxLength: 80 }
        cross_streets:
          type: string
          maxLength: 80
          example: King St N & University Ave
          description: |
            Public: the nearest intersection, shown with `neighbourhood` as the
            approximate location. Trimmed; an empty string clears it.
        distance_m: { type: integer, minimum: 0, nullable: true }
        shorter_stays:
          type: boolean
          description: Allow stays shorter than the listed dates. Defaults to false.
        min_stay_months:
          type: integer
          nullable: true
          minimum: 1
          maximum: 24
          description: |
            Required when `shorter_stays` is true, and at most `lease_months`.
            Must be absent or null otherwise.
        bills_estimate_cents:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100000
          description: |
            Your estimate of the tenant's monthly share of the bills not in the
            rent. 0 when everything is included; null or absent when you would
            rather not say.
        status:
          type: string
          enum: [draft, published]
          default: published
          description: Post as a draft to finish it later.

    ListingUpdate:
      type: object
      description: |
        A partial edit. Only the fields present are changed; anything omitted is
        left as it was. Status is not editable here — use `/listings/{id}/status`.
      properties:
        title: { type: string, minLength: 8, maxLength: 200 }
        body: { type: string, maxLength: 8000 }
        conditions:
          type: array
          items: { type: string, maxLength: 500 }
          maxItems: 12
        price_cents: { type: integer, minimum: 1 }
        deposit_cents: { type: integer, minimum: 0, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        lease_months: { type: integer, minimum: 1, maximum: 24 }
        term_tag: { type: string, maxLength: 40 }
        unit_type: { type: string, enum: [room, studio, unit] }
        bedrooms_total: { type: integer, minimum: 0, maximum: 20 }
        bedroom_of: { type: integer, minimum: 1, nullable: true }
        bathrooms: { type: number, minimum: 0 }
        bath_type: { type: string, enum: [shared, private, ensuite] }
        furnished: { type: boolean }
        utilities:
          type: array
          items: { type: string, enum: [internet, hydro, water, heat, gas] }
        parking: { type: boolean }
        pets: { type: boolean }
        laundry: { type: boolean }
        address_line:
          type: string
          maxLength: 200
          description: |
            Private: the exact address, house number included. Shown only to
            you, to admins, and to a student you choose to share it with in
            your conversation. It is not searchable.
        neighbourhood: { type: string, maxLength: 80 }
        cross_streets:
          type: string
          maxLength: 80
          example: King St N & University Ave
          description: |
            Public: the nearest intersection, shown with `neighbourhood` as the
            approximate location. Trimmed; an empty string clears it.
        distance_m: { type: integer, minimum: 0, nullable: true }
        shorter_stays:
          type: boolean
          description: Allow stays shorter than the listed dates. Defaults to false.
        min_stay_months:
          type: integer
          nullable: true
          minimum: 1
          maximum: 24
          description: |
            Required when `shorter_stays` is true, and at most `lease_months`.
            Must be absent or null otherwise.
        bills_estimate_cents:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100000
          description: |
            Your estimate of the tenant's monthly share of the bills not in the
            rent. 0 when everything is included; null or absent when you would
            rather not say.

    ListingOwner:
      type: object
      description: |
        Just enough about the poster to render a listing. Never their email. A
        listing's exact address reaches another student only when its owner
        shares it in a conversation.
      required: [id, username, verified]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        avatar_url:
          type: string
          nullable: true
        verified:
          type: boolean

    ListingPhoto:
      type: object
      required: [id, url, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        position:
          type: integer

    ListingPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        meta:
          $ref: "#/components/schemas/PageMeta"

    HousingRequest:
      type: object
      description: |
        A "Looking for Housing" post: what a student needs, rather than what
        they have. The mirror of a listing, and structured for the same reason -
        an owner can filter these the way a student filters listings.

        No address of any kind. `max_distance_m` is how far out they would
        consider, not where they are.
      required:
        - id
        - title
        - body
        - budget_cents
        - start_date
        - end_date
        - lease_months
        - term_tag
        - occupants
        - pets
        - furnished_preferred
        - parking_needed
        - laundry_needed
        - neighbourhood
        - status
        - views
        - offers
        - created_at
        - poster
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        budget_cents:
          type: integer
          description: The most they will pay per month, in cents.
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        lease_months: { type: integer }
        term_tag: { type: string }
        occupants:
          type: integer
          description: How many people the place is for, including the poster.
        pets: { type: boolean }
        furnished_preferred: { type: boolean }
        parking_needed: { type: boolean }
        laundry_needed: { type: boolean }
        max_distance_m:
          type: integer
          nullable: true
          description: |
            How far from campus they would accept, in metres. Null means no
            stated preference, which is not the same as a large radius.
        neighbourhood: { type: string }
        status:
          type: string
          enum: [draft, published, paused, archived]
        published_at: { type: string, format: date-time, nullable: true }
        views: { type: integer }
        offers:
          type: integer
          description: How many owners have answered. Always 0 until Phase 7.
        created_at: { type: string, format: date-time }
        poster:
          $ref: "#/components/schemas/ListingOwner"
        removal:
          $ref: "#/components/schemas/PostRemoval"

    RequestInput:
      type: object
      description: A new request. Everything an owner filters on is required.
      required:
        - title
        - budget_cents
        - start_date
        - end_date
        - lease_months
        - term_tag
      properties:
        title: { type: string, minLength: 8, maxLength: 200 }
        body: { type: string, maxLength: 8000 }
        budget_cents: { type: integer, minimum: 1 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        lease_months: { type: integer, minimum: 1, maximum: 24 }
        term_tag: { type: string, maxLength: 40 }
        occupants: { type: integer, minimum: 1, maximum: 12, default: 1 }
        pets: { type: boolean }
        furnished_preferred: { type: boolean }
        parking_needed: { type: boolean }
        laundry_needed: { type: boolean }
        max_distance_m: { type: integer, minimum: 1, nullable: true }
        neighbourhood: { type: string, maxLength: 80 }
        status:
          type: string
          enum: [draft, published]
          default: published
          description: Post as a draft to finish it later.

    RequestUpdate:
      type: object
      description: |
        A partial edit. Only the fields present are changed. Status is not
        editable here - use `/requests/{id}/status`.
      properties:
        title: { type: string, minLength: 8, maxLength: 200 }
        body: { type: string, maxLength: 8000 }
        budget_cents: { type: integer, minimum: 1 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        lease_months: { type: integer, minimum: 1, maximum: 24 }
        term_tag: { type: string, maxLength: 40 }
        occupants: { type: integer, minimum: 1, maximum: 12 }
        pets: { type: boolean }
        furnished_preferred: { type: boolean }
        parking_needed: { type: boolean }
        laundry_needed: { type: boolean }
        max_distance_m: { type: integer, minimum: 1, nullable: true }
        neighbourhood: { type: string, maxLength: 80 }

    RequestPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/HousingRequest"
        meta:
          $ref: "#/components/schemas/PageMeta"

    RequestOffer:
      type: object
      description: |
        An owner's answer to a request: one of their own listings, with an
        optional note. The listing travels with the offer, so the student sees
        a real place rather than a pitch.
      required: [id, request_id, note, created_at, listing, owner]
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        note: { type: string }
        created_at: { type: string, format: date-time }
        listing:
          $ref: "#/components/schemas/Listing"
        owner:
          $ref: "#/components/schemas/ListingOwner"

    Conversation:
      type: object
      description: |
        A conversation about one listing, as one of its two participants sees
        it. Everything that depends on who is looking - which side you are,
        who the other person is, what you may do next - is worked out for you,
        so no other participant's id or email is ever exposed.
      required:
        - id
        - status
        - listing
        - counterpart
        - viewer_is_owner
        - opened_by_viewer
        - can_send
        - last_message
        - unread_count
        - created_at
        - closed_at
        - closed_by_viewer
        - counterpart_available
        - address_shared_at
        - can_share_address
        - place
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [open, closed]
        listing:
          $ref: "#/components/schemas/ConversationListing"
        counterpart:
          description: The other participant. Never their email.
          allOf:
            - $ref: "#/components/schemas/ListingOwner"
        viewer_is_owner:
          type: boolean
          description: You own the listing; the counterpart is the enquirer.
        opened_by_viewer:
          type: boolean
          description: You started this conversation.
        can_send:
          type: boolean
          description: |
            You may send a message now: the conversation is open, the other
            participant's account is available, and the listing has not been
            taken down.
        last_message:
          description: The newest message, or null when there is none yet.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MessagePreview"
        unread_count:
          type: integer
          minimum: 0
          description: Messages from the other participant you have not read.
        created_at: { type: string, format: date-time }
        closed_at:
          type: string
          format: date-time
          nullable: true
        closed_by_viewer:
          type: boolean
          nullable: true
          description: Null while open; whether you were the one who closed it.
        counterpart_available:
          type: boolean
          description: |
            False while the other participant's account is suspended. The
            conversation stays readable, and nothing can be sent.
        address_shared_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the owner shared the exact address in this conversation, or
            null if they have not. Set once, by the owner's share and nothing
            else, and never cleared. A client places the "address shared" event
            in the thread by this time. It stays set while the address itself
            is withheld (see `place`).
        can_share_address:
          type: boolean
          description: |
            You may share the exact address now: you are the listing's owner
            and verified, the conversation is open, the enquirer's account is
            available, the listing is available (published, not taken down),
            and the address has not been shared here yet.
        place:
          description: |
            The exact address, for both participants of this conversation only.
            Non-null exactly when the owner has shared it here
            (`address_shared_at` is set), the listing is not taken down and its
            owner is not suspended. Null otherwise: before sharing, and while
            moderation withholds it.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConversationPlace"

    ConversationPlace:
      type: object
      description: |
        A listing's exact address, as its owner shared it in one conversation.
        Read live from the listing, so a correction the owner makes later shows
        here. Only the address: never an email or a phone number.
      required: [address_line, lat, lng]
      properties:
        address_line:
          type: string
          description: The exact address, house number included.
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true

    ConversationListing:
      type: object
      description: |
        The listing a conversation is about, summarised. It carries no address.
        `available` is false when the public can no longer see the listing:
        paused, archived, taken down, or its owner suspended.
      required: [id, title, neighbourhood, price_cents, start_date, end_date, available]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        neighbourhood: { type: string }
        price_cents: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        available: { type: boolean }

    Message:
      type: object
      description: |
        One message. Append-only: it cannot be edited or deleted.
      required: [id, conversation_id, from_viewer, body, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        from_viewer:
          type: boolean
          description: You sent it.
        body: { type: string }
        created_at: { type: string, format: date-time }

    MessagePreview:
      type: object
      description: The start of the newest message, for an inbox row.
      required: [from_viewer, body, created_at]
      properties:
        from_viewer: { type: boolean }
        body:
          type: string
          description: The first 140 characters of the message.
        created_at: { type: string, format: date-time }

    MessageInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            1 to 4000 characters once surrounding whitespace is trimmed. The
            trimmed text is what is stored.

    ConversationPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        meta:
          $ref: "#/components/schemas/PageMeta"

    MessagePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        meta:
          $ref: "#/components/schemas/PageMeta"

    UnreadCounts:
      type: object
      required: [conversations, messages]
      properties:
        conversations:
          type: integer
          minimum: 0
          description: Conversations with at least one unread message.
        messages:
          type: integer
          minimum: 0
          description: Unread messages across all your conversations.

    AdminUser:
      type: object
      description: |
        An account as an operator sees it. Deliberately separate from `User`:
        the public shape has no business growing an operator's fields. Counts
        include posts in every status.
      required: [id, email, username, role, verified, created_at, suspended_at, suspend_reason, listing_count, request_count, offer_count]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role:
          type: string
          enum: [user, moderator, admin]
        verified: { type: boolean }
        created_at: { type: string, format: date-time }
        suspended_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the account is suspended; null otherwise.
        suspend_reason:
          type: string
          nullable: true
        listing_count: { type: integer, minimum: 0 }
        request_count: { type: integer, minimum: 0 }
        offer_count: { type: integer, minimum: 0 }

    AdminReason:
      type: object
      description: Why an admin is making a change. Recorded in the ledger.
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 1000
          description: At least ten characters once trimmed.

    AdminRoleChange:
      type: object
      required: [role, reason]
      properties:
        role:
          type: string
          enum: [user, admin]
        reason:
          type: string
          minLength: 10
          maxLength: 1000

    PostRemoval:
      type: object
      description: |
        A moderator's takedown. Present only on the owner's own reads and the
        admin surface; a removed post never reaches a public read.
      required: [removed_at, reason]
      properties:
        removed_at: { type: string, format: date-time }
        reason:
          type: string
          description: The moderator's reason, shown to the owner as written.

    AdminOptionalReason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000

    AdminPostOwner:
      type: object
      description: Whose post it is, as an operator needs to know it.
      required: [id, username, email, verified, suspended_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        verified: { type: boolean }
        suspended_at:
          type: string
          format: date-time
          nullable: true

    AdminListing:
      type: object
      required: [listing, owner]
      properties:
        listing:
          $ref: "#/components/schemas/Listing"
        owner:
          $ref: "#/components/schemas/AdminPostOwner"

    AdminListingPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminListing"
        meta:
          $ref: "#/components/schemas/PageMeta"

    AdminRequest:
      type: object
      required: [request, owner]
      properties:
        request:
          $ref: "#/components/schemas/HousingRequest"
        owner:
          $ref: "#/components/schemas/AdminPostOwner"

    AdminRequestPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminRequest"
        meta:
          $ref: "#/components/schemas/PageMeta"

    AdminUserPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        meta:
          $ref: "#/components/schemas/PageMeta"

    AdminUserDetail:
      type: object
      required: [user, actions]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        actions:
          type: array
          description: What admins have done to this account, newest first.
          items:
            $ref: "#/components/schemas/AdminAction"

    AdminAction:
      type: object
      description: One ledger entry.
      required: [id, action, subject_type, subject_id, reason, detail, actor, created_at]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          enum: [set_role, suspend, reinstate, verify, remove_post, restore_post]
        subject_type:
          type: string
          enum: [user, listing, request]
        subject_id: { type: string, format: uuid }
        reason: { type: string }
        detail:
          type: object
          additionalProperties: true
          description: |
            The before and after of this change. Its shape depends on the
            action - for `set_role`, `{"from": "user", "to": "admin"}`.
        actor:
          $ref: "#/components/schemas/AdminActor"
        created_at: { type: string, format: date-time }

    AdminActor:
      type: object
      nullable: true
      description: |
        Who acted. Null when the change was made from the host with
        `cmd/admin`, or when the acting account no longer exists.
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }

    AdminActionPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAction"
        meta:
          $ref: "#/components/schemas/PageMeta"

    AdminOverview:
      type: object
      required: [users, listings, requests, actions_last_week]
      properties:
        users:
          $ref: "#/components/schemas/AdminUserCounts"
        listings:
          $ref: "#/components/schemas/AdminPostCounts"
        requests:
          $ref: "#/components/schemas/AdminPostCounts"
        actions_last_week:
          type: integer
          minimum: 0
          description: Ledger entries written in the last seven days.

    AdminUserCounts:
      type: object
      required: [total, verified, suspended, admins]
      properties:
        total: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
        suspended: { type: integer, minimum: 0 }
        admins: { type: integer, minimum: 0 }

    AdminPostCounts:
      type: object
      required: [total, published]
      properties:
        total:
          type: integer
          minimum: 0
          description: Every post, whatever its status.
        published: { type: integer, minimum: 0 }

    Error:
      type: object
      description: |
        The single error envelope. Every failing request in this API returns this
        shape, so the frontend has exactly one error contract to handle.
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable explanation. Safe to show to a user.
        details:
          type: object
          additionalProperties:
            type: string
          description: |
            Field-level problems, keyed by field name. Present on validation
            failures, omitted otherwise.
        request_id:
          type: string
          description: Correlates this response with the service's logs.
      example:
        code: not_found
        message: No listing with that id.
        request_id: 9f1c2f7a-6f2e-4d2a-9a1b-2c3d4e5f6a7b

    ErrorCode:
      type: string
      description: |
        Stable, machine-readable reason. Clients branch on this; `message` is for
        humans and may be reworded without notice.
      enum:
        - bad_request
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - internal_error
        - service_unavailable

    PageMeta:
      type: object
      description: Pagination metadata accompanying every list response.
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page, 1-based.
        per_page:
          type: integer
          minimum: 1
          description: Items per page, after the server's maximum is applied.
        total:
          type: integer
          minimum: 0
          description: Total items matching the query across all pages.
        total_pages:
          type: integer
          minimum: 0
          description: Total pages available at this page size.
      example:
        page: 1
        per_page: 20
        total: 6
        total_pages: 1

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number, 1-based.
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      required: false
      description: Items per page. Values above the server maximum are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session was presented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but not permitted — typically an unverified account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: |
        Too many attempts. The limit is per identity — the address being logged
        into, the account being reset, the signed-in user — not per IP address,
        because this service sits on a private network where every request
        arrives from the frontend's address.

        `message` names the wait in plain words and is safe to show to a user.
        Nothing is locked: the allowance refills on a clock.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Something failed inside the service.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: waterloostar_session
      description: |
        JWT in an httpOnly, SameSite cookie set by the auth endpoints. Delivered
        as a cookie rather than a bearer token so the Next.js frontend can read
        it during server rendering. Because the credential is a cookie, unsafe
        methods additionally require the CSRF header below.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit token, required on every unsafe method when authenticating
        by cookie. Its value must match the `waterloostar_csrf` cookie.

security:
  - sessionCookie: []
